name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token needs nothing beyond reading the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the floor: node:sqlite and type stripping both need it.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # The build must not depend on a configured secret.
          AI_BRAIN_DB: ./data/brain.db

  fresh-install:
    name: Clean-environment install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm

      # This is the job that keeps the README honest: it runs exactly the
      # commands a new user is told to run, in an environment with nothing
      # set up, and then checks the result actually works.
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup

      - name: The documented first run produces a working brain
        run: |
          set -euo pipefail
          node tools/cli/src/index.ts migrate
          node tools/cli/src/index.ts connectors | grep -q "GitHub (github)"
          node tools/cli/src/index.ts help | grep -q "AI BRAIN command line"
          echo "fresh install verified"
        env:
          AI_BRAIN_DB: ./data/ci.db

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Known vulnerabilities
        # Advisory data changes daily, so a new high-severity advisory should
        # be visible without turning every unrelated PR red.
        run: pnpm audit --audit-level high || echo "::warning::pnpm audit reported findings; review them"

      - name: Committed secrets
        run: pnpm lint
