name: Feature request
description: Something AI BRAIN should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check `docs/roadmap.md` first — it lists what is deliberately not
        in this release, and why.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you currently cannot?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: What would it be grounded in?
      description: |
        This project does not display anything it has not observed. If your
        feature needs data, where would that data come from?
    validations:
      required: true
